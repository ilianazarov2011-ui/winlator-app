name: PortHub APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Подготовить манифест и название
        run: |
          python3 porthub_patch.py
          echo "активностей PortHub в манифесте:"
          grep -c PortHubActivity app/src/main/AndroidManifest.xml

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: porthub-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Выложить в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PortHub сборка ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
